name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux Packages (.deb, .rpm, .tar.gz on Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve package version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build optimized release binary
        run: cargo build --release --locked -p bongocat-app

      - name: Build .deb, .rpm, and .tar.gz packages
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash packaging/build-deb.sh
          bash packaging/build-rpm.sh
          bash packaging/build-tarball.sh
          (cd dist && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS)

      - name: Verify generated packages
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          cat dist/SHA256SUMS

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
